<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV Builder · hmsk.life</title>
<meta name="description" content="Free CV builder for a German Lebenslauf, a UK CV and a US résumé from one form. Live preview, PDF with real text (ATS friendly). No signup, data stays on your device.">
<meta name="theme-color" content="#0B0F0C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css?v=1">
<style id="pageStyle">@page { size: A4; margin: 57px 68px; }</style>
</head>
<body>
<a class="skip" href="#main" id="skipLink">Skip to content</a>
<nav class="strip" aria-label="hmsk.life">
  <a class="strip__home" id="lnkHome" href="/tools/cv-builder/">← hmsk.life</a>
  <button type="button" class="strip__lang" id="langBtn" lang="de" aria-label="Auf Deutsch wechseln">DE</button>
  <a id="lnkImprint" href="/imprint/">Imprint</a>
  <a id="lnkPrivacy" href="/privacy/">Privacy</a>
</nav>

<header class="top">
  <div class="top__in">
    <p class="logo"><span class="logo__u">cv</span><span class="dim">@</span>builder<span class="dim">:~$</span></p>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button type="button" data-view="edit">edit</button>
      <button type="button" data-view="preview">preview</button>
    </nav>
    <div class="bar" id="bar"></div>
  </div>
</header>

<div id="banner" class="banner" hidden></div>
<main id="main" class="layout" tabindex="-1">
  <noscript><p class="pad">This tool needs JavaScript. Your data stays in your browser.</p></noscript>
  <section class="editor" id="editor" aria-label="Editor"></section>
  <section class="pv" id="pv" aria-label="Preview">
    <div class="pv__meta"><span id="pagecount"></span> <span id="over" class="over-msg"></span></div>
    <ul class="checks" id="checks"></ul>
    <div id="offer"></div>
    <details class="tips" id="tips"></details>
    <div class="stage" id="stage"><div class="paper" id="paper"></div></div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js?v=1"></script>
<script src="i18n.js?v=1"></script>
<script src="core.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
